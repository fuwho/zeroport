<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZeroPort — guided walkthrough</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M20 4 L33.9 12 L33.9 28 L20 36 L6.1 28 L6.1 12 Z' fill='none' stroke='%232563EB' stroke-width='4'/%3E%3Crect x='11.5' y='17.6' width='17' height='4.8' rx='2.4' fill='%23059669'/%3E%3C/svg%3E">
<style>
/* ═══════════════════════════════════════════════════════════════════
   The console shares the marketing site's tokens, with one deliberate
   difference: the canvas.

   The site is white because it is read once. This is a workspace, held
   on screen for the length of a walkthrough, and it is layered -- a
   rail, a main card, two panels. On white, every one of those layers
   would have to be carved out by borders alone, and the whole thing
   reads as a form rather than an instrument. So the canvas is a cool
   slate mist and every surface that carries text is white on top of it.
   Cards then separate by luminance, borders can stay quiet, and no text
   ever sits on the tint -- which is what keeps contrast honest, since
   the muted grey that clears AA on white does not clear it on a tint.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --canvas:#E9EEF6;              /* slate mist -- gutters only, never text */
  --panel:#FFFFFF; --panel2:#F8FAFC; --bg2:#F8FAFC;
  --line:#E2E8F0; --line-2:#CBD5E1;

  --ink:#0F172A;                 /* 17.4:1 on white */
  --body:#475569;                /*  7.4:1 */
  --mut:#64748B;                 /*  4.8:1 */

  --blue:#2563EB; --blue-700:#1D4ED8; --blue-50:#EFF6FF; --blue-100:#DBEAFE;
  --cyan:#1D4ED8;                /* kept as a name; the accent is blue now */
  --green:#047857; --green-50:#ECFDF5; --green-100:#D1FAE5;
  --red:#DC2626; --red-50:#FEF2F2; --red-100:#FECACA;
  --amber:#B45309; --amber-50:#FFFBEB; --amber-100:#FDE68A;

  --mono:ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  --sans:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;

  --sh-1:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.06);
  --sh-2:0 2px 4px rgba(15,23,42,.04),0 6px 16px rgba(15,23,42,.06);
  --sh-3:0 4px 8px rgba(15,23,42,.04),0 14px 32px rgba(15,23,42,.09);
  --ease:cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--canvas);color:var(--body);min-height:100vh;
  font:15px/1.65 var(--sans);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  /* A whisper of grid, so the canvas reads as an instrument panel rather
     than an empty page. Barely there on purpose. */
  background-image:linear-gradient(rgba(37,99,235,.028) 1px,transparent 1px),
    linear-gradient(90deg,rgba(37,99,235,.028) 1px,transparent 1px);
  background-size:30px 30px;
}
:where(a,button,[tabindex]):focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

header{
  background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);padding:13px 22px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20;
}
.brand{display:flex;align-items:center;gap:11px}
.word{font-weight:800;font-size:18px;letter-spacing:.04em;color:var(--ink)}
.sub{font:700 9px/1 var(--sans);letter-spacing:.19em;color:var(--blue);margin-top:5px}
.spacer{flex:1}
.hostinfo{font:600 11px/1.55 var(--mono);color:var(--mut);text-align:right}
.hostinfo b{color:var(--green)}
.conn{
  font:700 10px/1 var(--sans);letter-spacing:.09em;color:var(--red);
  background:var(--red-50);border:1px solid var(--red-100);padding:6px 10px;border-radius:20px;
}
.conn:empty{display:none}

.shell{display:grid;grid-template-columns:236px 1fr 344px;gap:18px;max-width:1560px;margin:0 auto;padding:22px 22px 56px}
/* Responsive overrides live at the end of this stylesheet, after the
   base rules they override -- see the block below. */

/* rail */
.rail{display:flex;flex-direction:column;gap:8px;position:sticky;top:80px;align-self:start}
.rstep{
  background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 14px;
  cursor:pointer;min-width:172px;text-align:left;font:inherit;color:inherit;box-shadow:var(--sh-1);
  transition:transform .18s var(--ease),border-color .18s var(--ease),box-shadow .18s var(--ease),background .18s var(--ease);
}
.rstep:hover{transform:translateY(-1px);border-color:var(--line-2);box-shadow:var(--sh-2)}
.rstep.on{border-color:var(--blue);background:var(--blue-50);box-shadow:0 0 0 3px rgba(37,99,235,.1),var(--sh-2)}
.rstep .n{font:700 9.5px/1 var(--mono);letter-spacing:.13em;color:var(--mut);margin-bottom:6px}
.rstep.on .n{color:var(--blue)}
.rstep.done .n{color:var(--green)}
.rstep .t{font-size:12.5px;font-weight:650;color:var(--ink);line-height:1.38;letter-spacing:-.008em}

/* main */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--sh-2)}
.chead{padding:18px 24px;border-bottom:1px solid var(--line);background:var(--panel2)}
.chead .n{font:700 10px/1 var(--sans);letter-spacing:.17em;color:var(--blue);margin-bottom:9px}
.chead h1{font-size:clamp(20px,2.4vw,25px);line-height:1.2;letter-spacing:-.022em;color:var(--ink);font-weight:750}
.cbody{padding:24px}
.setup p{margin-bottom:14px;max-width:66ch}
.setup p:last-child{margin-bottom:0}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 0}
button{
  font:650 13.5px/1 var(--sans);color:var(--ink);background:var(--panel);
  border:1px solid var(--line-2);border-radius:10px;padding:12px 18px;cursor:pointer;box-shadow:var(--sh-1);
  transition:transform .16s var(--ease),border-color .16s var(--ease),color .16s var(--ease),box-shadow .16s var(--ease),background .16s var(--ease);
}
button:hover:not(:disabled){border-color:var(--blue);color:var(--blue-700);transform:translateY(-1px);box-shadow:var(--sh-2)}
button:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
button.go{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 1px 2px rgba(4,120,87,.26),0 5px 14px rgba(4,120,87,.2)}
button.go:hover:not(:disabled){background:#03684A;border-color:#03684A;color:#fff;box-shadow:0 3px 6px rgba(4,120,87,.24),0 12px 26px rgba(4,120,87,.24)}
button.danger:hover:not(:disabled){border-color:var(--red);color:var(--red)}
.out{margin-top:20px;border-top:1px solid var(--line);padding-top:18px;font-family:var(--mono);font-size:12.5px;min-height:26px}
.ln{padding:5px 0;display:flex;gap:11px;align-items:baseline}
.ln .k{color:var(--mut);min-width:14px}
.ln.ok .v{color:var(--green);font-weight:600} .ln.no .v{color:var(--red);font-weight:600} .ln.hi .v{color:var(--blue-700)}
.ln .v{color:var(--body)}
.big{font:800 32px/1 var(--sans);letter-spacing:-.03em;margin:5px 0}
.cmp{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0 6px}
/* Direct children only -- the bare `div` selector also boxed the label
   and the number inside each panel, giving boxes within boxes. */
.cmp>div{flex:1;min-width:158px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px}
.cmp .lbl{font:700 9.5px/1 var(--sans);letter-spacing:.11em;color:var(--mut);margin-bottom:10px}
.idea{
  margin-top:20px;border:1px solid var(--blue-100);background:var(--blue-50);
  padding:16px 20px;border-radius:12px;font-size:14.5px;line-height:1.65;color:var(--body);
}
.idea b{color:var(--blue-700);display:block;font:700 9.5px/1 var(--sans);letter-spacing:.15em;margin-bottom:8px}
.nav{display:flex;justify-content:space-between;margin-top:22px;gap:10px}

/* side */
.side{display:flex;flex-direction:column;gap:16px;position:sticky;top:80px;align-self:start}
.pnl{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--sh-2)}
.pnl h2{
  font:700 10px/1 var(--sans);letter-spacing:.14em;color:var(--ink);padding:13px 16px;
  border-bottom:1px solid var(--line);background:var(--panel2);display:flex;align-items:center;gap:8px;
}
.pnl .b{padding:14px 16px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td{padding:9px 4px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
.mono{font-family:var(--mono);font-size:10.5px;color:var(--mut);margin-top:3px}
.pill{display:inline-block;font:700 9px/1 var(--sans);letter-spacing:.06em;padding:5px 9px;border-radius:20px;white-space:nowrap}
.pill.ok{background:var(--green-50);color:var(--green);border:1px solid var(--green-100)}
.pill.bad{background:var(--red-50);color:var(--red);border:1px solid var(--red-100)}
.pill.warn{background:var(--amber-50);color:var(--amber);border:1px solid var(--amber-100)}
.stream{max-height:310px;overflow-y:auto;font-family:var(--mono);font-size:11px}
.row{display:flex;gap:9px;padding:7px 8px;border-radius:7px;align-items:baseline}
.row:nth-child(odd){background:var(--panel2)}
.row .s{color:var(--mut);min-width:28px}
.row .vb{min-width:48px;font-weight:700}
.row.allow .vb{color:var(--green)} .row.deny .vb{color:var(--red)} .row.info .vb{color:var(--blue-700)}
.row .m{color:var(--body);word-break:break-word}
.row .m b{color:var(--ink)}
.empty{color:var(--mut);font-size:11.5px;padding:16px 0;text-align:center}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:5px;border:2px solid var(--panel)}
::-webkit-scrollbar-thumb:hover{background:var(--mut)}

/* ── Responsive ───────────────────────────────────────────────────
   Last in the file on purpose: .rail and .side set position:sticky in
   their base rules above, and at equal specificity the later rule wins.
   Declared any earlier, these overrides would silently lose. */
@media(max-width:1300px){
  .shell{grid-template-columns:206px 1fr}
  .side{grid-column:1/-1;position:static;flex-direction:row;flex-wrap:wrap}
  .side>.pnl{flex:1;min-width:300px}
}
@media(max-width:900px){
  .shell{grid-template-columns:1fr;padding:16px 16px 40px;gap:14px}
  /* The rail becomes a horizontal filmstrip so the steps do not push
     the walkthrough itself below six cards of scrolling. */
  .rail{flex-direction:row;overflow-x:auto;position:static;padding-bottom:6px;scroll-snap-type:x proximity}
  .rail .rstep{flex:0 0 auto;min-width:158px;scroll-snap-align:start}
  .side{flex-direction:column}
  .side>.pnl{min-width:0}
  .cbody{padding:18px}
  .chead{padding:16px 18px}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 4 L33.9 12 L33.9 28 L20 36 L6.1 28 L6.1 12 Z" fill="none" stroke="#2563EB" stroke-width="3.5"/><rect x="11.5" y="17.6" width="17" height="4.8" rx="2.4" fill="#059669"/></svg>
    <div><div class="word">ZEROPORT</div><div class="sub">GUIDED WALKTHROUGH</div></div>
  </div>
  <div class="spacer"></div>
  <div class="hostinfo">running on <b id="netHost">…</b><br>five programs · real sockets</div>
  <div class="conn" id="cs">CONNECTING</div>
</header>

<div class="shell">
  <div class="rail" id="rail"></div>

  <div>
    <div class="card">
      <div class="chead">
        <div class="n" id="sn">STEP 1 OF 6</div>
        <h1 id="st">…</h1>
      </div>
      <div class="cbody">
        <div class="setup" id="setup"></div>
        <div class="acts" id="acts"></div>
        <div class="out" id="out"></div>
        <div id="ideaBox"></div>
        <div class="nav">
          <button id="prev">← Back</button>
          <button id="next" class="go">Next step →</button>
        </div>
      </div>
    </div>
  </div>

  <div class="side">
    <div class="pnl">
      <h2>WHO IS ON THE NETWORK</h2>
      <div class="b"><table><tbody id="roster"><tr><td class="empty">waiting…</td></tr></tbody></table></div>
    </div>
    <div class="pnl">
      <h2>WHAT THE SERVICE RECORDED <span style="margin-left:auto" id="chainBadge"><span class="pill ok">CHAIN INTACT</span></span></h2>
      <div class="b"><div class="stream" id="stream"><div class="empty">nothing yet…</div></div></div>
    </div>
  </div>
</div>

<script>
const $=(s)=>document.querySelector(s);
let sock,state={},cur=0,busy=false;
const done=new Set();
let LASTPEERS=[];
let seenState=false;

const STEPS=[
 {t:'The door that isn’t there',reset:1,
  setup:['Every attack starts the same way: find something that answers. A firewall answers. A VPN gateway answers. A bastion answers — that is how they get found, mapped, and eventually broken into.',
         'So look for the service the way an attacker would, then try it as someone who belongs.'],
  acts:[{id:'scan',label:'Scan for anything listening',go:true},
        {id:'rawPacket',label:'Send a packet with no credentials'},
        {id:'connect',label:'Connect as the officer'}],
  idea:'The service is not hidden behind a lock — it has no door at all. Being able to reach it is a property of holding the right key, which is why the scanner and the officer can both be telling the truth.'},

 {t:'How two machines meet when neither can be called',
  setup:['Both machines sit behind their own network. Neither has a public address, so neither can dial the other. They need an introduction.',
         'A rendezvous performs that introduction — and then gets out of the way. The same sealed packet is sent both ways so the cost of each is visible.'],
  acts:[{id:'pathCompare',label:'Send it both ways',go:true}],
  idea:'The introduction is brief and the middleman leaves. Traffic then runs directly between the two machines, so nothing sits in the middle of the conversation to slow it down, breach, or subpoena.'},

 {t:'Who is allowed to change the guest list',
  setup:['Someone has to decide which machines belong. In most systems that is an administrator account — and an account can be phished, coerced, or simply wrong.',
         'Here the authority is split across three officers. Try it with one, then with two.'],
  acts:[{id:'enrollOne',label:'One officer adds an unknown device',go:true},
        {id:'enrollTwo',label:'A second officer co-signs'},
        {id:'restore',label:'Put the safe list back'}],
  idea:'No single administrator can quietly add a machine. Not because policy forbids it, but because the signature one person is able to produce does not exist as a valid signature.'},

 {t:'What happens to a laptop that is stolen',reset:1,
  setup:['A device is taken. Nobody notices for a day. In most networks its credentials keep working until a human revokes them.',
         'Here permission is a lease that has to be renewed — so the question is what happens when a device simply stops asking.'],
  acts:[{id:'lease',label:'Give the laptop a 6-second lease',go:true},
        {id:'connect',label:'Try it now'},
        {id:'waitExpire',label:'Wait for it to lapse, then try again'}],
  idea:'Access decays unless it is renewed, so a device that goes quiet loses its permission on its own. The safe state is the default, and nobody has to be watching for it to hold.'},

 {t:'The two ways in that do not work',reset:1,
  setup:['Two attempts every real network faces: a machine that was never invited, and an invited machine reaching for something it was never given.',
         'Then one officer removes a machine while it is connected.'],
  acts:[{id:'rogue',label:'Unknown device tries the database',go:true},
        {id:'wrongPort',label:'The officer reaches for SSH'},
        {id:'revoke',label:'One officer removes her',danger:true}],
  idea:'Permission is per-machine and per-port, and it is checked on every request. A device that is not on the list, or is reaching somewhere it should not, is refused without ever learning why.'},

 {t:'The record of what happened',
  setup:['A security team’s last line of defence is the log — which is a problem, because whoever breaks in can usually edit it.',
         'Each entry carries the fingerprint of the one before it, and the end of the chain is published somewhere the attacker does not control.'],
  acts:[{id:'anchor',label:'Publish the chain to an outside witness',go:true},
        {id:'tamper',label:'Edit one line to hide a refusal',danger:true},
        {id:'forge',label:'Replace the whole file with a clean one',danger:true},
        {id:'untamper',label:'Put the log back'}],
  idea:'The log is not trusted because we promise to look after it. Editing one line breaks the chain, and swapping the whole file fails against a fingerprint held by somebody else.'}
];

function connect(){
  sock=new WebSocket('ws://'+location.host);
  sock.onopen=()=>{$('#cs').textContent='';};
  sock.onclose=()=>{$('#cs').textContent='DISCONNECTED — RECONNECTING';setTimeout(connect,1500);};
  sock.onmessage=(e)=>handle(JSON.parse(e.data));
}
connect();

const esc=(s)=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const line=(k,v,cls='')=>`<div class="ln ${cls}"><span class="k">${k}</span><span class="v">${v}</span></div>`;

function renderRail(){
  $('#rail').innerHTML=STEPS.map((s,i)=>
    `<button type="button" class="rstep${i===cur?' on':''}${done.has(i)?' done':''}" data-i="${i}"${i===cur?' aria-current="step"':''}>
      <div class="n">STEP ${i+1}${done.has(i)?' ✓':''}</div><div class="t">${esc(s.t)}</div></button>`).join('');
  document.querySelectorAll('.rstep').forEach(e=>e.onclick=()=>{cur=+e.dataset.i;renderStep();});
}
function renderStep(){
  const s=STEPS[cur];
  $('#sn').textContent=`STEP ${cur+1} OF ${STEPS.length}`;
  $('#st').textContent=s.t;
  $('#setup').innerHTML=s.setup.map(p=>`<p>${esc(p)}</p>`).join('');
  $('#acts').innerHTML=s.acts.map(a=>
    `<button data-a="${a.id}" class="${a.go?'go':''}${a.danger?' danger':''}">${esc(a.label)}</button>`).join('');
  document.querySelectorAll('#acts button').forEach(b=>b.onclick=()=>run(b.dataset.a,b));
  $('#out').innerHTML='';
  $('#ideaBox').innerHTML='';
  ensureBaseline();
  $('#prev').disabled=cur===0;
  $('#next').disabled=cur===STEPS.length-1;
  renderRail();
}
$('#prev').onclick=()=>{if(cur>0){cur--;renderStep();}};
$('#next').onclick=()=>{if(cur<STEPS.length-1){cur++;renderStep();}};

// True when the roster is in its everyday state: exactly the two legitimate
// machines, neither revoked nor on a lease. An empty list means we simply
// have not heard from the network yet - that is not a reason to republish.
// Republish the everyday roster if this step needs it and the network has
// drifted (a lease issued, a peer revoked) from an earlier step.
function ensureBaseline(){
  if(!STEPS[cur].reset||atBaseline())return;
  if(!sock||sock.readyState!==1)return;
  $('#out').innerHTML=line('·','putting the network back to its everyday state first…','hi');
  sock.send(JSON.stringify({action:'restore',quiet:1}));
}
function atBaseline(){
  const p=LASTPEERS;
  if(!p.length)return true;
  if(p.length!==2)return false;
  return !p.some(x=>x.revoked||x.leaseExpires);
}
function showIdea(){
  if($('#ideaBox').innerHTML)return;
  $('#ideaBox').innerHTML=`<div class="idea"><b>THE IDEA</b>${esc(STEPS[cur].idea)}</div>`;
  done.add(cur);renderRail();
}

let waitTimer=null;
async function run(action,btn){
  if(busy)return; busy=true;
  document.querySelectorAll('#acts button').forEach(b=>b.disabled=true);
  const out=$('#out');

  if(action==='waitExpire'){
    let n=7;
    const tick=()=>{
      out.innerHTML=line('·',`waiting — nothing is being revoked, nobody is touching anything … ${n}s`,'hi');
      if(--n<0){clearInterval(waitTimer);sock.send(JSON.stringify({action:'connect'}));}
    };
    tick(); waitTimer=setInterval(tick,1000);
    return;
  }
  out.innerHTML=line('·','working…','hi');
  sock.send(JSON.stringify({action}));
}
function unlock(){busy=false;document.querySelectorAll('#acts button').forEach(b=>b.disabled=false);}

function handle(m){
  if(m.type==='state'){
    state=m;
    if(m.netHost)$('#netHost').textContent=m.netHost;
    renderRoster((m.roster&&m.roster.peers)||[]);
    // On a fresh page load we render step 1 before the roster has arrived, so
    // this is the first moment we can tell whether a previous run left the
    // network in a changed state. Put it back if so.
    if(!seenState){seenState=true;ensureBaseline();}
  }
  else if(m.type==='audit'){renderStream(m.entries||[],m.chain);renderChain(m.chain);}
  else if(m.type==='result'){if(m.quiet){$('#out').innerHTML='';unlock();return;}result(m);}
}

function result(m){
  const out=$('#out');let h='';
  if(m.action==='scan'){
    h+=line('·',`${m.scanned} ports probed on ${esc(m.host)}`);
    h+=line('→',`database port 5432 — ${m.servicePortOpen?'OPEN':'nothing there'}`,m.servicePortOpen?'no':'ok');
    h+=line('→',`the agent's own socket ${m.agentPort} — ${m.agentPortOpen?'open':'refuses TCP entirely'}`,'ok');
    if(m.open.length)h+=line('·',`Open: ${esc(m.open.join(', '))} — the control plane, not the service.`);
    if(m.other&&m.other.length)h+=line('·',`Also open: ${m.other.join(', ')} — other software on this machine, nothing to do with ZeroPort.`);
  }
  else if(m.action==='rawPacket'){
    h+=line('→',m.replied?'It answered.':'No reply. The agent read it, found no valid signature, and stopped.',m.replied?'no':'ok');
    h+=line('·','An attacker learns nothing — not even that something is there.');
  }
  else if(m.action==='connect'){
    h+=m.ok?line('→',`Connected. Encrypted round trip returned "${esc(m.reply)}" in ${m.rttMs.toFixed(2)} ms.`,'ok')
           :line('→',`Refused. The caller is told only: "${esc(m.reason)}"`,'no')
            +(m.logReason?line('·',`The service recorded why: "${esc(m.logReason)}"`):'');
  }
  else if(m.action==='pathCompare'){
    h+=`<div class="cmp">
      <div><div class="lbl">VIA THE RENDEZVOUS · 2 HOPS</div><div class="big" style="color:var(--amber)">${m.relayed.toFixed(1)}<span style="font-size:14px"> ms</span></div>
      <div style="font-size:11.5px;color:var(--mut)">it moved the bytes but could not read them</div></div>
      <div><div class="lbl">DIRECT · 1 HOP</div><div class="big" style="color:var(--green)">${m.direct.toFixed(1)}<span style="font-size:14px"> ms</span></div>
      <div style="font-size:11.5px;color:var(--mut)">the introducer has left the path</div></div></div>`;
    if(m.direct>0)h+=line('→',`${Math.round(m.relayed/m.direct)}× faster once they have met.`,'ok');
  }
  else if(m.action==='enrollOne')h+=line('→',m.ok?'Accepted.':`The directory refuses it: "${esc(m.message)}"`,m.ok?'no':'ok')
    +line('·','Not a permission error. One share cannot form a signature for the group key.');
  else if(m.action==='enrollTwo')h+=line('→',m.ok?'Accepted. Two shares combined into one signature.':`Refused — ${esc(m.message)}`,m.ok?'ok':'no');
  else if(m.action==='restore')h+=line('→','Safe list restored.','ok');
  else if(m.action==='lease')h+=line('→','Lease issued. It expires in six seconds unless renewed.','hi');
  else if(m.action==='rogue')h+=line('→',m.ok?'It got in.':'Dropped in silence.',m.ok?'no':'ok')
    +line('·',`The service recorded: "${esc(m.reason||'')}"`);
  else if(m.action==='wrongPort')h+=line('→',m.ok?'Allowed.':'Dropped.',m.ok?'no':'ok')
    +line('·',`Log: "${esc(m.reason||'')}"`)
    +line('·','Her permission is for one port on one machine, not for the network.');
  else if(m.action==='revoke')h+=line('→','Removed — signed by a single officer.','ok')
    +line('·','Adding a machine takes two people. Removing one takes one, deliberately.');
  else if(m.action==='anchor')h+=line('→',m.ok?`Accepted by ${esc((m.calendar||'').replace('https://',''))} — a witness we do not control.`:'The outside service is unreachable right now.',m.ok?'ok':'no')
    +line('·',`chain head ${esc((m.head||'').slice(0,32))}…`);
  else if(m.action==='tamper')h+=line('→',m.ok===false?`Caught at line ${m.line} — the fingerprints stop matching.`:'The edit went unnoticed.',m.ok===false?'ok':'no')
    +line('·',esc(m.reason||''));
  else if(m.action==='verify')h+=line('→',m.ok?`Chain intact — ${m.entries} entries recomputed.`:`Broken — ${esc(m.reason||'')}`,m.ok?'ok':'no');
  else if(m.action==='forge'){
    if(m.needAnchor){h+=line('→','Publish the chain to a witness first — there is nothing to compare against yet.','no');}
    else{
      h+=line('·',`${m.removed} refusal${m.removed===1?'':'s'} deleted, then every fingerprint recomputed from scratch`);
      h+=line('→',m.internallyOk?'The new file is internally consistent: every link checks out.':'The forgery is not even internally consistent.',m.internallyOk?'no':'ok');
      h+=line('·',`its head    ${esc((m.head||'').slice(0,32))}…`);
      h+=line('·',`published   ${esc((m.anchored||'').slice(0,32))}…`);
      h+=line('→',m.matches?'It matches the witness — undetected.':'They do not match. Caught by a copy we do not hold.',m.matches?'no':'ok');
    }
  }
  else if(m.action==='untamper')h+=line('→',m.ok?`Original restored — ${m.entries} entries, every link recomputes.`:'Restore failed.',m.ok?'ok':'no');
  else h+=line('→',JSON.stringify(m));
  out.innerHTML=h;
  showIdea();unlock();
}

setInterval(()=>{if(LASTPEERS.some(p=>p.leaseExpires))renderRoster(LASTPEERS)},1000);
function renderRoster(peers){
  LASTPEERS=peers;
  const tb=$('#roster');
  if(!peers.length){tb.innerHTML='<tr><td class="empty">waiting…</td></tr>';return;}
  tb.innerHTML=peers.map(p=>{
    let pill='<span class="pill ok">ON THE LIST</span>';
    if(p.revoked)pill='<span class="pill bad">REMOVED</span>';
    else if(p.leaseExpires&&p.leaseExpires<Date.now())pill='<span class="pill bad">LEASE LAPSED</span>';
    else if(p.leaseExpires)pill=`<span class="pill warn">LEASED · ${Math.max(0,Math.ceil((p.leaseExpires-Date.now())/1000))}s</span>`;
    return `<tr><td><b style="color:var(--ink)">${esc(p.name)}</b><div class="mono">${esc(p.id)}</div></td><td style="text-align:right">${pill}</td></tr>`;
  }).join('');
}
function renderChain(c){
  if(!c)return;
  $('#chainBadge').innerHTML=c.ok?'<span class="pill ok">CHAIN INTACT</span>':'<span class="pill bad">CHAIN BROKEN</span>';
}
function renderStream(entries,chain){
  const s=$('#stream');
  if(!entries.length){s.innerHTML='<div class="empty">nothing yet…</div>';return;}
  // verifyLog reports the 1-based line where the fingerprints stop matching
  const badSeq=(chain&&!chain.ok&&chain.line)?entries[chain.line-1]&&entries[chain.line-1].seq:null;
  s.innerHTML=entries.map(e=>{
    const ev=e.event||{};let cls='info',vb='INFO',m='';
    if(e.seq===badSeq){return `<div class="row deny"><span class="s">#${e.seq}</span><span class="vb">FORGED</span><span class="m">this line was edited — the fingerprint no longer matches</span></div>`;}
    if(ev.type==='flow'){cls='allow';vb='ALLOW';m=`<b>${esc(ev.peer||'')}</b> → ${esc(ev.service||'')} · ${ev.bytes||0}B`;}
    else if(ev.type==='deny'){cls='deny';vb='DENY';m=`<b>${esc(ev.peer||'unknown')}</b> — ${esc(ev.reason||'')}`;}
    else if(ev.type==='handshake'){vb='TUNNEL';m=esc(ev.peer||'');}
    else m=esc(ev.type||'');
    return `<div class="row ${cls}"><span class="s">#${e.seq}</span><span class="vb">${vb}</span><span class="m">${m}</span></div>`;
  }).reverse().join('');
}

renderStep();
